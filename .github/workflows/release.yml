name: Build release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.5"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m venv .venv313
          .\.venv313\Scripts\python.exe -m pip install --upgrade pip
          .\.venv313\Scripts\python.exe -m pip install -r requirements.txt

      - name: Verify build environment
        shell: pwsh
        run: .\.venv313\Scripts\python.exe build.py --verify

      - name: Clean release output
        shell: pwsh
        run: |
          if (Test-Path dist) {
            Remove-Item dist -Recurse -Force
          }

      - name: Build executable
        shell: pwsh
        run: .\.venv313\Scripts\python.exe build.py

      - name: Verify release executable size
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist -Filter "Huangue Fish bot v *.exe" | Select-Object -First 1
          if (-not $exe) {
            throw "Release executable was not created"
          }
          if ($exe.Length -lt 200MB) {
            throw "Release executable is unexpectedly small ($($exe.Length) bytes); refusing to upload incomplete build"
          }

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Huangue Fish bot v *.exe
          generate_release_notes: true
